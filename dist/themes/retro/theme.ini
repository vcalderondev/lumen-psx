# Lumen theme (docs/themes.md): a 1990s console look. The grey of the original console's
# shell, square corners, a plain engineering typeface (Barlow, fonts/OFL.txt), button
# glyphs with hard corners (glyphs/, tools/make-glyphs.py --square) and the four colours
# of its logo: yellow for highlights and the focus, blue for the main button, red for danger.
name = Retro
author = LPSX
radius = 0
accent = #F3C300
focus = #F3C300
primary = #2E6DB4
on_primary = #FFFFFF
card = #3A3B40
card_alpha = 1.0
text = #F0F0EC
dim = #B4B5BA
backdrop = #0E0E12
panel = #1C1C21
danger = #E0312D
lit = #F3C300

# menus over the dimmed art, glass cards lit from the top (the look before LPSX went black)
scrim = 0.60
scrim_settings = 0.60
selected = 0.24
card_light = 1
