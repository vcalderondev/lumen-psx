[system]
id = apps
name = Homebrew
order = 90

[library]
; one folder per app: /media/games/apps/<name>/app.ini (Title=, Exec=, Publisher=, Year=)
; + icon.png / background.jpg / music.ogg next to it (docs/systems.md, "Apps")
layout = apps
paths = /media/games/apps

[media]
kind = card
aspect = 0.64
color = #2b2f3a
art = cover
media_art = cart

[animation]
launch = insert_cartridge
idle = float

[demo]
allowed = 0
