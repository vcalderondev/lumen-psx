; The console's 20 built-in games, read-only on the internal game partition.
; Listed only when the settings say so (show_stock_games=1, Settings > Library).
[system]
id = psxstock
name = PlayStation Classic
logo = psx/logo.png
order = 12

[library]
layout = stock
paths = /gaadata
metadata = psxstock.games
extensions = cue,bin

[launch]
core = pcsx_rearmed_libretro.so

[media]
kind = disc
shape = jewel
aspect = 1.136
color = #141217
art = cover
media_art = disc

[animation]
launch = flat
flat = psx
idle = float

[graphics]
core_options_name = PCSX-ReARMed
enhanced = pcsx_rearmed_neon_enhancement_enable=enabled, pcsx_rearmed_neon_enhancement_no_main=enabled
original = pcsx_rearmed_neon_enhancement_enable=disabled, pcsx_rearmed_neon_enhancement_no_main=disabled

[demo]
allowed = 1
seconds = 0
