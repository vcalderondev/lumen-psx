[system]
id = megadrive
name = Mega Drive
logo = logo.png
order = 30

[library]
layout = files
paths = /media/games/megadrive
extensions = md,gen,bin,smd,zip

[launch]
core = genesis_plus_gx_libretro.so

[media]
kind = cartridge
shape = cart_md
; PAL / Genesis cartridge, 109 x 70 mm
aspect = 1.557
color = #101010
art = label
media_art = cart

[animation]
launch = insert_cartridge
idle = float

[graphics]
retroarch_enhanced = video_smooth=true
retroarch_original = video_smooth=false

[demo]
allowed = 0
seconds = 0
