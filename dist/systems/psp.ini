[system]
id = psp
name = PlayStation Portable
logo = logo.png
order = 45

[library]
layout = files
paths = /media/games/psp
extensions = iso,cso,chd,pbp

[launch]
; psc-platform's PPSSPP (GLES 3 through RetroArch's gl driver). It needs its assets in
; <RetroArch system_directory>/PPSSPP/ (psc-platform release: ppsspp-assets.tar.gz)
core = ppsspp_libretro.so

[media]
kind = disc
shape = umd
; UMD keep case, 105 x 180 mm
aspect = 0.583
color = #1a1a1e
art = cover
media_art = disc

[animation]
launch = open_case_disc
idle = float

[graphics]
core_options_name = PPSSPP
enhanced = ppsspp_internal_resolution=960x544
original = ppsspp_internal_resolution=480x272
retroarch_enhanced = video_smooth=true
retroarch_original = video_smooth=false

[demo]
allowed = 0
seconds = 0
