[system]
id = psx
name = PlayStation
logo = logo.png
order = 10

[library]
layout = psc
paths = /media/games/psx
extensions = cue,pbp,chd,m3u
; games recompiled to run natively, one folder each with an app.ini (docs/systems.md, "Native ports")
ports = /media/games/psx-native

[launch]
core = pcsx_rearmed_libretro.so

[media]
kind = disc

[graphics]
core_options_name = PCSX-ReARMed
enhanced = pcsx_rearmed_neon_enhancement_enable=enabled, pcsx_rearmed_neon_enhancement_no_main=enabled
original = pcsx_rearmed_neon_enhancement_enable=disabled, pcsx_rearmed_neon_enhancement_no_main=disabled

[demo]
allowed = 1
seconds = 0
