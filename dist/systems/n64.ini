[system]
id = n64
name = Nintendo 64
logo = logo.png
order = 25

[library]
layout = files
paths = /media/games/n64
extensions = z64,n64,v64,zip

[launch]
core = mupen64plus_next_libretro.so

[media]
kind = cartridge

[graphics]
; Mupen64Plus-Next's defaults are too heavy for the console: GLideN64 runs on its own
; thread (the CPU emulation gets a core to itself), no colour / depth buffer copies to
; RDRAM, no LOD emulation or hybrid filter, frame duping. The presets only differ in the
; internal resolution: original = the console's own 320x240, enhanced = 640x480, native
; = the display's height (4:3).
; Never ThreadedRenderer with EnableFBEmulation=False: that pair hangs the core.
core_options_name = Mupen64Plus-Next
original = mupen64plus-ThreadedRenderer=True, mupen64plus-43screensize=320x240, mupen64plus-EnableCopyColorToRDRAM=Off, mupen64plus-EnableCopyDepthToRDRAM=Off, mupen64plus-HybridFilter=False, mupen64plus-EnableLODEmulation=False, mupen64plus-FrameDuping=True
enhanced = mupen64plus-ThreadedRenderer=True, mupen64plus-43screensize=640x480, mupen64plus-EnableCopyColorToRDRAM=Off, mupen64plus-EnableCopyDepthToRDRAM=Off, mupen64plus-HybridFilter=False, mupen64plus-EnableLODEmulation=False, mupen64plus-FrameDuping=True
native_720 = mupen64plus-ThreadedRenderer=True, mupen64plus-43screensize=960x720, mupen64plus-EnableCopyColorToRDRAM=Off, mupen64plus-EnableCopyDepthToRDRAM=Off, mupen64plus-HybridFilter=False, mupen64plus-EnableLODEmulation=False, mupen64plus-FrameDuping=True
native_1080 = mupen64plus-ThreadedRenderer=True, mupen64plus-43screensize=1440x1080, mupen64plus-EnableCopyColorToRDRAM=Off, mupen64plus-EnableCopyDepthToRDRAM=Off, mupen64plus-HybridFilter=False, mupen64plus-EnableLODEmulation=False, mupen64plus-FrameDuping=True
retroarch_enhanced = video_smooth=true
retroarch_original = video_smooth=false

[demo]
allowed = 0
seconds = 0
