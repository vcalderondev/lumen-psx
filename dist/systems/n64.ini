[system]
id = n64
name = Nintendo 64
logo = logo.png
order = 25

[library]
layout = files
paths = /media/games/n64
extensions = z64,n64,v64,zip

[launch]
core = mupen64plus_next_libretro.so

[media]
kind = cartridge
shape = cart_n64
aspect = 1.53
color = #3c3c42
art = label
media_art = cart

[animation]
launch = insert_cartridge
idle = float

[graphics]
; Mupen64Plus-Next's defaults are too heavy for the console. Both presets drop the
; colour buffer copy to RDRAM and turn frame duping on.
;   original  the fastest: GLideN64 on its own thread (the CPU emulation gets a core to
;             itself), native 320x240, no depth copy, no LOD / hybrid filter
;   enhanced  640x480 with the filters; single thread
; Never ThreadedRenderer with EnableFBEmulation=False: that pair hangs the core.
core_options_name = Mupen64Plus-Next
enhanced = mupen64plus-ThreadedRenderer=False, mupen64plus-43screensize=640x480, mupen64plus-EnableCopyColorToRDRAM=Off, mupen64plus-EnableCopyDepthToRDRAM=Software, mupen64plus-HybridFilter=True, mupen64plus-EnableLODEmulation=True, mupen64plus-FrameDuping=True
original = mupen64plus-ThreadedRenderer=True, mupen64plus-43screensize=320x240, mupen64plus-EnableCopyColorToRDRAM=Off, mupen64plus-EnableCopyDepthToRDRAM=Off, mupen64plus-HybridFilter=False, mupen64plus-EnableLODEmulation=False, mupen64plus-FrameDuping=True
retroarch_enhanced = video_smooth=true
retroarch_original = video_smooth=false

[demo]
allowed = 0
seconds = 0
