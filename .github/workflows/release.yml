# Release: build Lumen with the PSC toolchain, take the compositor (Wayland 1.26 +
# Weston), RetroArch 1.22, the cores and the unsigned boot payload from the psc-platform
# release pinned in platform.lock, sign the payload (console keyring from a private
# input: never in this repository), and publish the ready-to-use USB package.
# Push a tag vX.Y.Z equal to LUMEN_VERSION (src/version.h) with a CHANGELOG.md section.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to (re)build and publish
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: lumen
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Version, changelog, platform pin
        run: |
          cd lumen
          v=$(sed -n 's/.*LUMEN_VERSION "\(.*\)"/\1/p' src/version.h)
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG != LUMEN_VERSION $v (src/version.h)"; exit 1; }
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          . ./platform.lock
          echo "PSC_PLATFORM=$PSC_PLATFORM" >> "$GITHUB_ENV"
      - name: psc-platform release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$PSC_PLATFORM" -R vcalderondev/psc-platform -D "$RUNNER_TEMP/platform"
          (cd "$RUNNER_TEMP/platform" && sha256sum -c SHA256SUMS)
      # the toolchain action of the SAME pinned psc-platform release
      - uses: vcalderondev/psc-platform/.github/actions/toolchain@v2.2.1
        with:
          sysroot-token: ${{ secrets.PSC_SYSROOT_TOKEN }}
      # Lumen's boot payload: signed here from the private input and verified with the
      # console's own gpg/busybox (ARMv7 emulation) before it can go into the zip
      - uses: vcalderondev/psc-platform/.github/actions/boot-payload@v2.2.1
        with:
          payload: ${{ runner.temp }}/platform/psc-boot-payload.tar.gz
          out-dir: ${{ runner.temp }}/boot
          private-token: ${{ secrets.PSC_SYSROOT_TOKEN }}
      - name: Build Lumen
        run: |
          $PSC_TOOLCHAIN/psc sh lumen/build.sh
          sudo chown -R "$(id -u)" lumen/out
      - name: Package
        run: |
          z=$(lumen/scripts/package.sh "$TAG" "$RUNNER_TEMP/platform" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/boot")
          (cd "$RUNNER_TEMP/dist" && sha256sum *.zip > SHA256SUMS)
          { cat "$RUNNER_TEMP/notes.md"; echo
            echo "### Platform: psc-platform $PSC_PLATFORM"; echo '```'; cat "$RUNNER_TEMP/platform/versions.txt"; echo '```'
            echo; echo "Install: format a USB stick FAT32 with the name SONY, unzip at its root, plug it into the console and power on (README-INSTALL.txt). No Project Eris needed."; } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd lumen
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/dist/* --title "Lumen PSX $TAG" --notes-file "$RUNNER_TEMP/body.md"
          fi
