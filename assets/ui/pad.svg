    <path stroke="#f4f4f7" d="M8.17709 15.5C8.52965 15.8112 8.99278 16 9.5 16C10.6046 16 11.5 15.1046 11.5 14C11.5 12.8954 10.6046 12 9.5 12C8.39543 12 7.5 12.8954 7.5 14V16C7.5 17.1046 7 18 5 18C4 18 2.5 17.775 2.5 16V8C2.5 6.89543 3.39543 6 4.5 6H9C9 5.44772 8.52129 5 7.93077 5H5.7923C5.47814 5 5.19562 5.12672 5 5.32848M15.8229 15.5C15.4703 15.8112 15.0072 16 14.5 16C13.3954 16 12.5 15.1046 12.5 14C12.5 12.8954 13.3954 12 14.5 12C15.6046 12 16.5 12.8954 16.5 14V16C16.5 17.1046 17 18 19 18C21 18 21.5 17.775 21.5 16V8C21.5 6.89543 20.6046 6 19.5 6H15C15 5.44772 15.4787 5 16.0692 5H18.2077C18.5219 5 18.8044 5.12672 19 5.32848M14 6C14 5.17157 13.3284 4.5 12.5 4.5H11.5C10.6716 4.5 10 5.17157 10 6"/>
    <!-- thumbsticks: the cap's rim and its dimple -->
    <circle cx="9.5" cy="14" r="1.1" stroke="#f4f4f7" stroke-width="0.35"/><circle cx="9.5" cy="14" r="0.35" fill="#f4f4f7" stroke="none"/>
    <circle cx="14.5" cy="14" r="1.1" stroke="#f4f4f7" stroke-width="0.35"/><circle cx="14.5" cy="14" r="0.35" fill="#f4f4f7" stroke="none"/>
