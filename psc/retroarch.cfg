# Lumen's RetroArch config (installed as /media/lumen/retroarch/retroarch.cfg).
# Owned by Lumen: RetroArch never writes it (config_save_on_exit = false); the per-launch
# overrides (profile save folders, 1080p, graphics presets' ra.* keys, demo mode) come
# from run.sh via --appendconfig. Keys not listed keep RetroArch's defaults.
config_save_on_exit = "false"

# PSC compositor (Weston 16): Wayland xdg-shell context, GLES 3.2 on the PowerVR GE8300
video_driver = "gl"
video_context_driver = "wayland"
video_fullscreen = "true"
video_fullscreen_x = "1280"
video_fullscreen_y = "720"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_scale_integer = "false"
aspect_ratio_index = "22"
video_shader_enable = "false"
video_font_enable = "true"
pause_nonactive = "false"

# HDMI audio: ALSA "default", S16 (the build forces it: FLOAT is refused by the driver)
audio_driver = "alsa"
audio_device = ""
audio_out_rate = "48000"
audio_latency = "64"
audio_sync = "true"

# input: evdev directly (the PSC pads and USB pads), joypad profiles in autoconfig/udev
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/media/lumen/retroarch/autoconfig"
input_max_users = "4"
input_libretro_device_p1 = "1"
input_libretro_device_p2 = "1"
input_player1_analog_dpad_mode = "0"
# Start+Select opens the menu (as in the Eris setup); quit from the menu or with RESET
input_menu_toggle_gamepad_combo = "4"
quit_press_twice = "false"

# menu: RGUI needs no asset files
menu_driver = "rgui"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_pause_libretro = "true"
menu_savestate_resume = "true"
menu_insert_disk_resume = "true"

# folders
libretro_directory = "/media/lumen/cores"
system_directory = "/media/lumen/retroarch/system"
savefile_directory = "/media/lumen/retroarch/saves"
savestate_directory = "/media/lumen/retroarch/states"
rgui_config_directory = "/media/lumen/retroarch/config"
input_remapping_directory = "/media/lumen/retroarch/config/remaps"
cache_directory = "/tmp/lumen-ra-cache"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"

# saves: an automatic state on quit (as before), never loaded automatically
savestate_auto_save = "true"
savestate_auto_load = "false"
block_sram_overwrite = "false"

# per-core options: <rgui_config_directory>/<Core Name>/<Core Name>.opt (Lumen merges
# the graphics presets there), per-game <Core Name>/<game>.opt wins
global_core_options = "false"
game_specific_options = "true"

# Lumen keeps its own play log and history
history_list_enable = "false"
content_runtime_log = "false"
content_runtime_log_aggregate = "false"
core_info_cache_enable = "false"

log_verbosity = "true"
frontend_log_level = "1"
