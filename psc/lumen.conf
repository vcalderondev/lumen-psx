# Lumen on the PlayStation Classic: how games are launched (sourced by run.sh).
#
# One emulator stack, no Project Eris: Lumen's own RetroArch (psc-platform/retroarch:
# RetroArch 1.22, GLES, ALSA, udev) installed in <home>/retroarch with Lumen's own config
# (<home>/retroarch/retroarch.cfg, never written by RetroArch) and the cores in
# <home>/cores (pcsx_rearmed from upstream). Saves, save states and per-core options
# live in <home>/retroarch/{saves,states,config} (the installer copied the Eris ones
# there once).
#
# Video, chosen from what boot.sh started (LUMEN_COMPOSITOR):
#  - weston6 / weston16 (the PSC compositor): Wayland xdg-shell context, as configured.
#  - stock (ours did not start; Sony's Weston 1.11 has no xdg-shell): native KMS. Sony's
#    Weston is stopped for the game, RetroArch takes the display directly (DRM/GBM) with
#    the Wayland 1.26 client libraries of the compositor package (it links them) from
#    /tmp, and Sony's Weston is started again for the frontend afterwards.
#
# Logging: RetroArch writes its log itself (--log-file, flushed after every line), so a
# crash or a power-off still leaves logs/retroarch.log; its stdout/stderr go to
# logs/retroarch.log.out (stdout redirected to the exFAT/FUSE stick is fully buffered).
LRA_DIR="${LUMEN_HOME}/retroarch"
LUMEN_CORE_OPT_DIR="${LRA_DIR}/config"
LUMEN_MAIN_SAVES="${LRA_DIR}/saves"
LUMEN_MAIN_STATES="${LRA_DIR}/states"
LRA_LIBS=/tmp/lumen-ra-libs

# lra_kms_libs: Wayland 1.26 client libraries for a RetroArch run without our compositor
lra_kms_libs() {
  [ -f "${LRA_LIBS}/lib/libwayland-client.so.0" ] && return 0
  for p in psc-weston-6.tar.gz psc-weston.tar.gz psc-weston-16.tar.gz; do
    [ -f "${LUMEN_HOME}/compositor/$p" ] || continue
    rm -rf "${LRA_LIBS}"; mkdir -p "${LRA_LIBS}"
    tar xzf "${LUMEN_HOME}/compositor/$p" -C "${LRA_LIBS}" 2>/dev/null &&
      [ -f "${LRA_LIBS}/lib/libwayland-client.so.0" ] && return 0
  done
  rm -rf "${LRA_LIBS}"; return 1
}

lra_stop_weston() {
  systemctl stop weston.service 2>/dev/null
  killall -s TERM weston 2>/dev/null
  i=0; while [ $i -lt 30 ] && pidof weston >/dev/null 2>&1; do sleep 0.1; i=$((i + 1)); done
  killall -s KILL weston 2>/dev/null; sleep 0.3
}

# Sony's Weston again for the frontend (boot.sh's config: 720p, or 1080p if it ran so)
lra_start_weston() {
  rm -f "${XDG_RUNTIME_DIR}/wayland-0" "${XDG_RUNTIME_DIR}/wayland-0.lock"
  if [ "${LUMEN_DISPLAY}" = 1080p ] && [ -f /tmp/lumen-weston.ini ]; then
    /usr/bin/weston-launch -u root -- --idle-time=4294967 --tty=1 --config=/tmp/lumen-weston.ini \
      > "${LOG}/weston.log" 2>&1 &
  else
    systemctl restart weston.service
  fi
  i=0; while [ $i -lt 80 ] && [ ! -S "${XDG_RUNTIME_DIR}/wayland-0" ]; do sleep 0.1; i=$((i + 1)); done
  sleep 0.5
}

lra_run() {  # core content logfile [extra cfg]
  [ -x "${LRA_DIR}/retroarch" ] || chmod +x "${LRA_DIR}/retroarch" 2>/dev/null
  mkdir -p "${LRA_DIR}/saves" "${LRA_DIR}/states" "${LRA_DIR}/config" "${LRA_DIR}/system" /tmp/lumen-ra-cache
  # crash reporter (psc-platform tools/debug): a crash leaves registers, a stack scan and
  # the library map in logs/crash.log
  pre=""; [ -f "${LUMEN_HOME}/debug/psc-crash.so" ] && pre="${LUMEN_HOME}/debug/psc-crash.so"
  LD_PRELOAD="${pre}" PSC_CRASH_LOG="${LOG}/crash.log" "${LRA_DIR}/retroarch" --config "${LRA_DIR}/retroarch.cfg" ${4:+--appendconfig "$4"} \
    --verbose --log-file "$3" -L "$1" "$2" > "$3.out" 2>&1
}

run_retroarch() {  # core content logfile
  if [ ! -f "${LRA_DIR}/retroarch" ] || [ ! -f "${LRA_DIR}/retroarch.cfg" ]; then
    slog "retroarch: not installed in ${LRA_DIR}"; return 127
  fi
  ver=$(sed -n 1p "${LRA_DIR}/VERSION" 2>/dev/null || echo 1.22)
  case "${LUMEN_COMPOSITOR}" in
    weston*)
      slog "retroarch: lumen (${ver}), wayland on ${LUMEN_COMPOSITOR}"
      if [ -s "${LUMEN_RA_EXTRA}" ]; then lra_run "$1" "$2" "$3" "${LUMEN_RA_EXTRA}"; else lra_run "$1" "$2" "$3"; fi
      return $? ;;
  esac
  # native KMS. RetroArch keeps the FIRST occurrence of a key within one file: the KMS
  # keys go first, then the per-launch overrides. KMS mode: the patched fallback (720p).
  lra_kms_libs || { slog "retroarch: no compositor package for the Wayland 1.26 libraries"; return 127; }
  { echo 'video_context_driver = "kms"'
    echo 'video_fullscreen_x = "0"'; echo 'video_fullscreen_y = "0"'
    [ -s "${LUMEN_RA_EXTRA}" ] && cat "${LUMEN_RA_EXTRA}"; } > /tmp/lumen-ra-kms.cfg
  slog "retroarch: lumen (${ver}), native KMS (compositor ${LUMEN_COMPOSITOR:-unknown})"
  lra_stop_weston
  LD_LIBRARY_PATH="${LRA_LIBS}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
    lra_run "$1" "$2" "$3" /tmp/lumen-ra-kms.cfg
  rc=$?
  lra_start_weston
  return $rc
}
